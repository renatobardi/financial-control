{% extends "base.html" %}
{% block titulo %}{{ t("bds.titulo") }}{% endblock %}
{% block corpo %}
<main class="mx-auto flex min-h-screen max-w-sm flex-col justify-center gap-5 p-6">
  <section class="flex flex-col gap-4 rounded-2xl bg-card p-6 ring-1 ring-border">
    {% if bds %}
    <header class="flex flex-col gap-1">
      <h1 class="text-xl font-semibold tracking-tight">{{ t("bds.titulo") }}</h1>
      <p class="text-muted-foreground">{{ t("bds.sub") }}</p>
    </header>
    <ul class="flex flex-col gap-2">
      {% for bd in bds %}
      <li>
        <form method="post" action="/bds/{{ bd.id }}">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button type="submit" class="flex w-full items-center gap-3 rounded-xl border border-border bg-background p-3 text-left">
            <span class="flex size-9 items-center justify-center rounded-lg bg-primary font-semibold text-primary-foreground">{{ bd.sigla }}</span>
            <span class="grow font-semibold">{{ bd.nome }}</span>
            <span class="rounded-4xl bg-muted px-2.5 py-0.5 text-xs text-muted-foreground">{{ bd.papel }}</span>
          </button>
        </form>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <header class="flex flex-col gap-1">
      <h1 class="text-xl font-semibold tracking-tight">{{ t("bds.sem_acesso") }}</h1>
      <p class="text-muted-foreground">{{ t("bds.sem_acesso_sub") }}</p>
    </header>
    {% endif %}
    <form method="post" action="/sair">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="text-muted-foreground underline">{{ t("auth.sair") }}</button>
    </form>
  </section>
</main>
{% endblock %}
