{% extends "base.html" %}
{% block corpo %}
<header class="flex items-center justify-between border-b border-border px-6 py-3">
  <span class="font-semibold">{{ t("inicio.bd_papel", bd=bd_nome, papel=papel) }}</span>
  <form method="post" action="/sair" class="flex items-center gap-3">
    <a href="/cadastros" class="underline">{{ t("cadastros.titulo") }}</a>
    <a href="/cargas" class="underline">{{ t("cargas.titulo") }}</a>
    <a href="/configuracoes" class="underline">{{ t("configuracoes.titulo") }}</a>
    <span class="text-muted-foreground">{{ t("inicio.ola", nome=usuario.nome) }}</span>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit" class="underline">{{ t("auth.sair") }}</button>
  </form>
</header>
<main class="p-6"></main>
{% endblock %}
