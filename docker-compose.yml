# Um serviço, um volume. O mesmo arquivo sobe no LXC do oute-server e na máquina de desenvolvimento.
services:
  app:
    build:
      context: .
      args:
        FINANCEIRO_COMMIT: ${FINANCEIRO_COMMIT:-desconhecido}
    # O segredo do cookie vem do .env (root, 0600, fora do git). Sem ele o app sobe e as sessões
    # caem a cada reinício. A senha do primeiro Admin NÃO vai aqui: o criar-admin pergunta no terminal.
    env_file:
      - path: .env
        required: false
    environment:
      FINANCEIRO_BD: /data/financeiro.db
    # Só a própria máquina por padrão. Atrás do nginx do host, o TLS fica no nginx.
    ports:
      - "${FINANCEIRO_PUBLICAR:-127.0.0.1:8000}:8000"
    volumes:
      - dados:/data
    restart: unless-stopped

volumes:
  dados:
