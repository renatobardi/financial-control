name: ci

# Só em pull request, com os dois gates do AGENTS.md. Push na main não roda workflow.
on:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: make test
      - run: make lint
